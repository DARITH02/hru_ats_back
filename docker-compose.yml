version: "3.9"

services:
  # ⚙️ Laravel Application (PHP + Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=attendance_db
      - DB_USERNAME=admin
      - DB_PASSWORD=admin123
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - attendance_net

  # 🗄️ MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: attendance_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - attendance_net

  # ⚡ Redis Cache
  redis:
    image: redis:7
    container_name: redis_cache
    networks:
      - attendance_net

networks:
  attendance_net:

volumes:
  mysql_data: